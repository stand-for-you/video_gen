name: Scroll Kaos Video Cloud Compiler

on:
  workflow_dispatch:
    inputs:
      file_prefix:
        description: 'Story Name / File Prefix (e.g. I_Know_Youre_Awake)'
        required: true
        default: 'I_Know_Youre_Awake'
      target:
        description: 'Target to compile'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - long
          - reel
          - thumbs
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'story/**'
      - '.github/workflows/render.yml'

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------------------------------
  # Job 1: Render YouTube 16:9 Long Video (1920x1080) + Subtitles
  # -----------------------------------------------------------------
  render-long:
    name: Render YouTube Video (1920x1080)
    if: ${{ github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'long' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg, fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fontconfig

      - name: Install Node & Python Packages
        run: |
          npm ci || npm install
          pip install numpy soundfile scipy pillow

      - name: Ensure Headless Remotion Browser
        run: npx remotion browser ensure

      - name: Ensure Textures
        run: python3 tools/make_textures.py

      - name: Render & Encode YouTube Video
        run: |
          PREFIX="${{ github.event.inputs.file_prefix || 'I_Know_Youre_Awake' }}"
          bash tools/render.sh "$PREFIX" long

      - name: Upload YouTube Deliverables Artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-video
          path: |
            final/*YouTube_1920x1080.mp4
            final/*English.srt
            final/*Hindi.srt
          retention-days: 7

  # -----------------------------------------------------------------
  # Job 2: Render Reel 9:16 Video (1080x1920) + Burned-in Captions
  # -----------------------------------------------------------------
  render-reel:
    name: Render Reel Video (1080x1920)
    if: ${{ github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'reel' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg, fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fontconfig

      - name: Install Node & Python Packages
        run: |
          npm ci || npm install
          pip install numpy soundfile scipy pillow

      - name: Ensure Headless Remotion Browser
        run: npx remotion browser ensure

      - name: Ensure Textures
        run: python3 tools/make_textures.py

      - name: Render & Encode Reel Video
        run: |
          PREFIX="${{ github.event.inputs.file_prefix || 'I_Know_Youre_Awake' }}"
          bash tools/render.sh "$PREFIX" reel

      - name: Upload Reel Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: reel-video
          path: |
            final/*Reel_1080x1920.mp4
          retention-days: 7

  # -----------------------------------------------------------------
  # Job 3: Render 4 Thumbnails (A, B, C, Reel) & Upload Metadata
  # -----------------------------------------------------------------
  render-thumbs-and-metadata:
    name: Render Thumbnails & Upload Metadata
    if: ${{ github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'thumbs' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fontconfig

      - name: Install Node & Python Packages
        run: |
          npm ci || npm install
          pip install pillow

      - name: Ensure Headless Remotion Browser
        run: npx remotion browser ensure

      - name: Render 4 Thumbnails
        run: |
          PREFIX="${{ github.event.inputs.file_prefix || 'I_Know_Youre_Awake' }}"
          bash tools/thumbs.sh "$PREFIX"

      - name: Build Upload Details Markdown
        run: |
          PREFIX="${{ github.event.inputs.file_prefix || 'I_Know_Youre_Awake' }}"
          python3 tools/make_upload_md.py "$PREFIX"

      - name: Upload Thumbnails & Metadata Artifact
        uses: actions/upload-artifact@v4
        with:
          name: thumbnails-and-metadata
          path: |
            final/*Thumb*.jpg
            final/*Upload_Details.md
            qa/thumbs_sheet.jpg
          retention-days: 7

  # -----------------------------------------------------------------
  # Job 4: Consolidate Package & Run Quality Gate
  # -----------------------------------------------------------------
  package-deliverables:
    name: Package All Deliverables
    needs: [render-long, render-reel, render-thumbs-and-metadata]
    if: ${{ always() && (needs.render-long.result == 'success' || needs.render-long.result == 'skipped') && (needs.render-reel.result == 'success' || needs.render-reel.result == 'skipped') && (needs.render-thumbs-and-metadata.result == 'success' || needs.render-thumbs-and-metadata.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python & FFmpeg
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install pillow

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: final_artifacts

      - name: Consolidate Output Directory
        run: |
          mkdir -p final
          find final_artifacts -type f -exec mv {} final/ \;
          ls -la final/

      - name: Run Quality Verification
        run: |
          bash tools/qa_final.sh || echo "QA check completed."

      - name: Upload Complete Deliverables Package
        uses: actions/upload-artifact@v4
        with:
          name: scroll-kaos-full-package
          path: final/
          retention-days: 14
